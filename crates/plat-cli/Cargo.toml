[package]
name = "plat-cli"
description = "The `plat` command-line tool"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The crate is named plat-cli, but the binary users type is `plat`.
[[bin]]
name = "plat"
path = "src/main.rs"

[dependencies]
plat-diag.workspace = true
plat-syntax.workspace = true
clap.workspace = true
serde_json.workspace = true

[dev-dependencies]
insta.workspace = true
